<svg xmlns="http://www.w3.org/2000/svg" width="890" height="340" viewBox="0 0 890 340">
  <rect width="890" height="340" fill="#090d15"/>
  <rect x="0" y="30" width="890" height="296" fill="#0d1117"/>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="5" dy="7" stdDeviation="6" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="railGlow" x="-400%" y="-20%" width="900%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="btnBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1b2232"/>
      <stop offset="1" stop-color="#0e121b"/>
    </linearGradient>
    <style>
      .btn{fill:url(#btnBg);filter:url(#shadow)}
      .txt{font-family:Segoe UI,Arial,sans-serif;font-size:18px;font-weight:800;text-anchor:middle;dominant-baseline:middle}
      .green{fill:#76e8a3}.gold{fill:#ffbd42}.blue{fill:#6db6ff}.pink{fill:#ff678a}.orange{fill:#ff9b3d}.purple{fill:#c080ff}
      .rail{stroke:#e8c64a;stroke-width:2;filter:url(#railGlow);opacity:.85}
      .note{font-family:Segoe UI,Arial,sans-serif;font-size:12px;fill:#93a4bd}
    </style>
  </defs>
  <text class="note" x="36" y="22">Proposed fix from the old good nav: remove The Card, add Manifest, keep Summary/Review on the far-left column.</text>
  <g class="rail">
    <line x1="213" y1="60" x2="213" y2="314"/>
    <line x1="307" y1="60" x2="307" y2="314"/>
    <line x1="401" y1="60" x2="401" y2="314"/>
    <line x1="495" y1="60" x2="495" y2="314"/>
    <line x1="589" y1="60" x2="589" y2="314"/>
    <line x1="683" y1="60" x2="683" y2="314"/>
    <line x1="777" y1="60" x2="777" y2="314"/>
  </g>
