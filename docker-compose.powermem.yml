version: '3.9'

services:
  powermem:
    image: oceanbase/powermem-server:latest
    container_name: polaris-powermem
    ports:
      - "8000:8000"
    environment:
      # LLM provider (using Anthropic Claude via OpenRouter)
      LLM_PROVIDER: openai
      LLM_MODEL: anthropic/claude-3-5-sonnet
      LLM_API_KEY: ${OPENROUTER_API_KEY}
      LLM_BASE_URL: https://openrouter.ai/api/v1

      # Embeddings provider (local or cloud)
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_MODEL: nomic-embed-text
      EMBEDDING_BASE_URL: http://host.docker.internal:11434/v1

      # Storage (SQLite for local development, can switch to PostgreSQL)
      STORAGE_TYPE: sqlite
      STORAGE_PATH: /data/powermem.db

      # Database config (if using PostgreSQL)
      # STORAGE_TYPE: postgres
      # DB_HOST: postgres
      # DB_PORT: 5432
      # DB_NAME: powermem
      # DB_USER: powermem
      # DB_PASSWORD: ${DB_PASSWORD}

      # Logging
      LOG_LEVEL: INFO

      # Memory config
      MEMORY_MAX_TOKENS: 8000
      MEMORY_RETENTION_DAYS: 365

      # Server config
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
    volumes:
      - powermem_data:/data
      - powermem_logs:/var/log/powermem
    networks:
      - polaris
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Ollama for local embeddings (remove if using cloud embeddings)
  ollama:
    image: ollama/ollama:latest
    container_name: polaris-ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - polaris
    restart: unless-stopped
    # On first run, pull the embedding model:
    # docker exec polaris-ollama ollama pull nomic-embed-text

volumes:
  powermem_data:
  powermem_logs:
  ollama_models:

networks:
  polaris:
    driver: bridge
